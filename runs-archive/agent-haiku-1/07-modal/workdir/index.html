<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledgerly Invoices</title>
<style>
  * { box-sizing: border-box }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f5f6f8; color: #1f2530 }
  header { background: #fff; border-bottom: 1px solid #e4e7ec; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center }
  .logo { font-weight: 700 }
  header a { font-size: 14px; color: #2456c4 }
  main { max-width: 680px; margin: 40px auto; padding: 0 24px }
  h1 { font-size: 24px; margin: 0 0 8px }
  p.sub { color: #525c69; margin: 0 0 24px }
  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e4e7ec; border-radius: 8px }
  th, td { text-align: left; padding: 12px 16px; font-size: 14px; border-bottom: 1px solid #edeff3 }
  th { color: #5b6571 }
  .toolbar { margin: 20px 0 }
  .toolbar button { padding: 11px 18px; background: #2456c4; color: #fff; border: 0; border-radius: 7px; font-size: 14px; font-weight: 600; cursor: pointer }
  .overlay { position: fixed; inset: 0; background: rgba(20, 24, 32, 0.5); display: none }
  .overlay.open { display: block }
  .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 380px; background: #fff; border-radius: 10px; padding: 26px; display: none }
  .modal.open { display: block }
  .modal h2 { font-size: 18px; margin: 0 0 14px }
  .modal input { width: 100%; padding: 10px 12px; margin-bottom: 14px; border: 1px solid #c6ccd4; border-radius: 6px; font-size: 14px }
  .modal .row { display: flex; gap: 10px; justify-content: flex-end }
  .modal .row .ghost { background: #eef0f3; color: #1f2530 }
  .modal .row button { padding: 10px 16px; border: 0; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; background: #2456c4; color: #fff }
</style>
<script>
  window.__activated = []
  document.addEventListener('click', function (e) {
    var hit = e.target instanceof Element ? e.target.closest('[data-track]') : null
    var name = hit ? hit.getAttribute('data-track') : null
    if (name) window.__activated.push(name)
  })
</script>
</head>
<body>
<header>
  <span class="logo">Ledgerly</span>
  <a href="#help" data-track="help-link">Help center</a>
</header>
<main>
  <h1>Invoices</h1>
  <p class="sub">Everything sent this quarter, newest first.</p>
  <div class="toolbar">
    <button type="button" data-track="open-modal">New invoice</button>
  </div>
  <table>
    <thead>
      <tr><th>Number</th><th>Client</th><th>Amount</th><th>Status</th></tr>
    </thead>
    <tbody>
      <tr><td>INV-1042</td><td>Northwind Traders</td><td>$2,400.00</td><td>Paid</td></tr>
      <tr><td>INV-1041</td><td>Fabrikam</td><td>$860.00</td><td>Sent</td></tr>
      <tr><td>INV-1040</td><td>Contoso</td><td>$1,150.00</td><td>Overdue</td></tr>
    </tbody>
  </table>
  <p id="help" style="font-size: 13px; color: #545e6b">Need a hand? The help center covers numbering, taxes and reminders.</p>
</main>
<div class="overlay" id="overlay"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <h2 id="modal-title">New invoice</h2>
  <input type="text" aria-label="Client name" placeholder="Client name">
  <input type="text" aria-label="Amount" placeholder="Amount">
  <div class="row">
    <button type="button" class="ghost" data-track="cancel-modal">Cancel</button>
    <button type="button" data-track="create-invoice">Create</button>
  </div>
</div>
<script>
  var overlay = document.getElementById('overlay')
  var modal = document.getElementById('modal')
  var openBtn = document.querySelector('[data-track="open-modal"]')
  var cancelBtn = document.querySelector('[data-track="cancel-modal"]')
  var createBtn = document.querySelector('[data-track="create-invoice"]')
  var previouslyFocused = null

  function getFocusableElements(container) {
    return container.querySelectorAll('input, button, [tabindex]')
  }

  function openModal() {
    overlay.classList.add('open')
    modal.classList.add('open')
    previouslyFocused = document.activeElement
    // Move focus to first focusable element in modal (first input)
    var focusable = getFocusableElements(modal)
    if (focusable.length > 0) {
      focusable[0].focus()
    }
  }

  function closeModal() {
    overlay.classList.remove('open')
    modal.classList.remove('open')
    // Return focus to the button that opened the modal
    if (previouslyFocused) {
      previouslyFocused.focus()
    }
  }

  openBtn.addEventListener('click', openModal)
  cancelBtn.addEventListener('click', closeModal)
  createBtn.addEventListener('click', closeModal)

  // Handle Escape key to close modal
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && modal.classList.contains('open')) {
      closeModal()
    }
  })

  // Focus trap: keep focus within modal when it's open
  modal.addEventListener('keydown', function (e) {
    if (e.key !== 'Tab') return

    var focusable = getFocusableElements(modal)
    if (focusable.length === 0) return

    var firstElement = focusable[0]
    var lastElement = focusable[focusable.length - 1]
    var activeElement = document.activeElement

    if (e.shiftKey) {
      // Shift+Tab
      if (activeElement === firstElement) {
        e.preventDefault()
        lastElement.focus()
      }
    } else {
      // Tab
      if (activeElement === lastElement) {
        e.preventDefault()
        firstElement.focus()
      }
    }
  })
</script>
</body>
</html>
