<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table for Two, Reservation</title>
<style>
  * { box-sizing: border-box }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f7f6f4; color: #26221f }
  header { background: #fff; border-bottom: 1px solid #e7e3de; padding: 16px 32px; font-weight: 700 }
  main { max-width: 480px; margin: 40px auto; background: #fff; border: 1px solid #e7e3de; border-radius: 10px; padding: 30px }
  h1 { font-size: 22px; margin: 0 0 6px }
  p.sub { color: #5d564f; margin: 0 0 22px; font-size: 14px; line-height: 1.55 }
  label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px }
  input { width: 100%; padding: 10px 12px; margin-bottom: 16px; border: 1px solid #cdc6be; border-radius: 6px; font-size: 15px }
  input:focus-visible { outline: 3px solid #8c3b2e }
  .row { display: flex; gap: 14px }
  .row > div { flex: 1 }
  button { width: 100%; padding: 12px; background: #8c3b2e; color: #fff; border: 0; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer }
  button:focus-visible { outline: 3px solid #000 }
  .note { font-size: 12px; color: #6f675f; margin-top: 14px }
</style>
<script>
  window.__activated = []
  document.addEventListener('click', function (e) {
    var hit = e.target instanceof Element ? e.target.closest('[data-track]') : null
    var name = hit ? hit.getAttribute('data-track') : null
    if (name) window.__activated.push(name)
  })
</script>
</head>
<body>
<header>Table for Two</header>
<main>
  <h1>Reserve a table</h1>
  <p class="sub">Evening seatings fill up by Thursday, book ahead for the weekend.</p>
  <form id="reserve-form">
    <div class="row">
      <div>
        <label for="first-name">First name</label>
        <input type="text" id="first-name" data-track="first-name">
      </div>
      <div>
        <label for="last-name">Last name</label>
        <input type="text" id="last-name" data-track="last-name">
      </div>
    </div>
    <label for="email">Email</label>
    <input type="email" id="email" data-track="email">
    <label for="party-size">Party size</label>
    <input type="number" id="party-size" data-track="party-size" min="1" max="8" value="2">
    <button type="submit" data-track="book">Book the table</button>
  </form>
  <p class="note">No card needed to hold the reservation, we just ask that you cancel before noon.</p>
</main>
<script>
  document.getElementById('reserve-form').addEventListener('submit', function (e) {
    e.preventDefault()
  })
</script>
</body>
</html>
