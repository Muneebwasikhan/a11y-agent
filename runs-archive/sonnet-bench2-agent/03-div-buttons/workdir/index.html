<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft Actions</title>
<style>
  * { box-sizing: border-box }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f4f5f7; color: #202632 }
  header { background: #fff; border-bottom: 1px solid #e3e6ea; padding: 16px 32px; font-weight: 700 }
  main { max-width: 640px; margin: 40px auto; padding: 0 24px }
  article { background: #fff; border: 1px solid #e3e6ea; border-radius: 10px; padding: 28px }
  h1 { font-size: 22px; margin: 0 0 10px }
  p { color: #46505e; line-height: 1.6; margin: 0 0 24px }
  .actions { display: flex; gap: 12px }
  .btn { padding: 10px 18px; border: none; border-radius: 8px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; user-select: none }
  .btn.primary { background: #1f6f43; color: #fff }
  .btn.neutral { background: #eef0f3; color: #202632 }
  .btn.danger { background: #fbeaea; color: #a03030 }
  .status { margin-top: 18px; font-size: 13px; color: #5a6472; min-height: 18px }
</style>
<script>
  window.__activated = []
  document.addEventListener('click', function (e) {
    var hit = e.target instanceof Element ? e.target.closest('[data-track]') : null
    var name = hit ? hit.getAttribute('data-track') : null
    if (name) window.__activated.push(name)
  })
</script>
</head>
<body>
<header>Quill</header>
<main>
  <article>
    <h1>Q3 retrospective notes</h1>
    <p>Draft saved 2 minutes ago. Shipping updates went out on time this quarter and the on-call load dropped by a third after the alert cleanup.</p>
    <div class="actions">
      <button type="button" class="btn primary" data-track="save">Save draft</button>
      <button type="button" class="btn neutral" data-track="share">Share</button>
      <button type="button" class="btn danger" data-track="discard">Discard</button>
    </div>
    <p class="status" id="status" role="status"></p>
  </article>
</main>
<script>
  var statusEl = document.getElementById('status')
  document.querySelector('[data-track="save"]').addEventListener('click', function () {
    statusEl.textContent = 'Draft saved.'
  })
  document.querySelector('[data-track="share"]').addEventListener('click', function () {
    statusEl.textContent = 'Share link copied.'
  })
  document.querySelector('[data-track="discard"]').addEventListener('click', function () {
    statusEl.textContent = 'Draft discarded.'
  })
</script>
</body>
</html>
